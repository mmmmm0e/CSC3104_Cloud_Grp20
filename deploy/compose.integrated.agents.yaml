services:
  crane-1:
    image: cranelock-agent:integrated
    ports:
      - "127.0.0.1:50101:50051"
      - "127.0.0.1:50201:50053"
    command:
      - run
      - --metrics-port
      - "9101"
      - --metrics-bind
      - 0.0.0.0
      - --id
      - crane-1
      - --listen
      - 0.0.0.0:50051
      - --peer
      - crane-2=crane-2:50051
      - --peer
      - crane-3=crane-3:50051
      - --holder
      - crane-1
      - --epoch
      - "0"
      - --state-file
      - /data/state.json
      - --gate-address
      - gate:50051
      - --gate-config
      - /config/config.json
      - --gate-keys
      - /signing/agent.json
      - --recovery-config
      - /config/config.json
      - --recovery-key
      - /signing/agent.json
      - --gate-tls-ca
      - /gate-tls/ca.pem
      - --gate-tls-cert
      - /gate-tls/client.pem
      - --gate-tls-key
      - /gate-tls/client-key.pem
      - --controller-address
      - controller:50052
      - --controller-tls-ca
      - /controller-tls/ca.pem
      - --controller-tls-cert
      - /controller-tls/client.pem
      - --controller-tls-key
      - /controller-tls/client-key.pem
      - --workload-listen
      - 0.0.0.0:50053
      - --workload-tls-ca
      - /workload/ca.pem
      - --workload-tls-cert
      - /workload/server.pem
      - --workload-tls-key
      - /workload/server-key.pem
      - --workload-allowlist
      - /workload/allowlist.json
    volumes:
      - crane-1-data:/data
      - type: bind
        source: ../demo-data/integrated/workload/crane-1/ca.pem
        target: /workload/ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../demo-data/integrated/workload/crane-1/server.pem
        target: /workload/server.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../demo-data/integrated/workload/crane-1/server-key.pem
        target: /workload/server-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../demo-data/integrated/workload/crane-1/allowlist.json
        target: /workload/allowlist.json
        read_only: true
        bind:
          create_host_path: false
      - ../demo-data/integrated/config.json:/config/config.json:ro
      - ../demo-data/integrated/signing/crane-1.json:/signing/agent.json:ro
      - ../demo-data/integrated/tls/gate/ca.pem:/gate-tls/ca.pem:ro
      - ../demo-data/integrated/tls/gate/client.pem:/gate-tls/client.pem:ro
      - ../demo-data/integrated/tls/gate/client-key.pem:/gate-tls/client-key.pem:ro
      - ../demo-data/integrated/tls/controller/ca.pem:/controller-tls/ca.pem:ro
      - ../demo-data/integrated/tls/controller/client.pem:/controller-tls/client.pem:ro
      - ../demo-data/integrated/tls/controller/client-key.pem:/controller-tls/client-key.pem:ro
    depends_on:
      gate:
        condition: service_healthy
      controller:
        condition: service_started
