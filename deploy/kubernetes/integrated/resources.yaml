{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "controller",
    "namespace": "cranelock"
  },
  "spec": {
    "replicas": 1,
    "strategy": {
      "type": "Recreate"
    },
    "selector": {
      "matchLabels": {
        "app": "controller",
        "part-of": "cranelock"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "controller",
          "part-of": "cranelock"
        }
      },
      "spec": {
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 10001,
          "runAsGroup": 10001,
          "fsGroup": 10001
        },
        "terminationGracePeriodSeconds": 15,
        "containers": [
          {
            "name": "controller",
            "image": "cranelock-agent:integrated",
            "imagePullPolicy": "IfNotPresent",
            "volumeMounts": [
              {
                "name": "file-0",
                "mountPath": "/config/config.json",
                "subPath": "config.json",
                "readOnly": true
              },
              {
                "name": "file-1",
                "mountPath": "/signing/controller.json",
                "subPath": "file-1",
                "readOnly": true
              },
              {
                "name": "file-2",
                "mountPath": "/gate-tls/ca.pem",
                "subPath": "file-2",
                "readOnly": true
              },
              {
                "name": "file-3",
                "mountPath": "/gate-tls/client.pem",
                "subPath": "file-3",
                "readOnly": true
              },
              {
                "name": "file-4",
                "mountPath": "/gate-tls/client-key.pem",
                "subPath": "file-4",
                "readOnly": true
              },
              {
                "name": "file-5",
                "mountPath": "/controller-tls/ca.pem",
                "subPath": "file-5",
                "readOnly": true
              },
              {
                "name": "file-6",
                "mountPath": "/controller-tls/server.pem",
                "subPath": "file-6",
                "readOnly": true
              },
              {
                "name": "file-7",
                "mountPath": "/controller-tls/server-key.pem",
                "subPath": "file-7",
                "readOnly": true
              }
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "96Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "384Mi"
              }
            },
            "command": [
              "python",
              "-m",
              "cranelock.run_controller"
            ],
            "args": [
              "--metrics-port",
              "9101",
              "--metrics-bind",
              "0.0.0.0",
              "--gate-config",
              "/config/config.json",
              "--controller-key",
              "/signing/controller.json",
              "--gate-address",
              "gate:50051",
              "--listen",
              "0.0.0.0:50052",
              "--gate-tls-ca",
              "/gate-tls/ca.pem",
              "--gate-tls-cert",
              "/gate-tls/client.pem",
              "--gate-tls-key",
              "/gate-tls/client-key.pem",
              "--tls-ca",
              "/controller-tls/ca.pem",
              "--tls-cert",
              "/controller-tls/server.pem",
              "--tls-key",
              "/controller-tls/server-key.pem"
            ],
            "ports": [
              {
                "name": "service",
                "containerPort": 50052
              },
              {
                "name": "metrics",
                "containerPort": 9101
              }
            ],
            "readinessProbe": {
              "tcpSocket": {
                "port": 50052
              },
              "periodSeconds": 5,
              "timeoutSeconds": 3,
              "failureThreshold": 12
            },
            "startupProbe": {
              "tcpSocket": {
                "port": 50052
              },
              "periodSeconds": 5,
              "timeoutSeconds": 3,
              "failureThreshold": 30
            },
            "livenessProbe": {
              "tcpSocket": {
                "port": 50052
              },
              "periodSeconds": 10,
              "timeoutSeconds": 3,
              "failureThreshold": 6
            }
          }
        ],
        "volumes": [
          {
            "name": "file-0",
            "configMap": {
              "name": "cranelock-public"
            }
          },
          {
            "name": "file-1",
            "secret": {
              "secretName": "controller-files"
            }
          },
          {
            "name": "file-2",
            "secret": {
              "secretName": "controller-files"
            }
          },
          {
            "name": "file-3",
            "secret": {
              "secretName": "controller-files"
            }
          },
          {
            "name": "file-4",
            "secret": {
              "secretName": "controller-files"
            }
          },
          {
            "name": "file-5",
            "secret": {
              "secretName": "controller-files"
            }
          },
          {
            "name": "file-6",
            "secret": {
              "secretName": "controller-files"
            }
          },
          {
            "name": "file-7",
            "secret": {
              "secretName": "controller-files"
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "controller",
    "namespace": "cranelock"
  },
  "spec": {
    "selector": {
      "app": "controller",
      "part-of": "cranelock"
    },
    "ports": [
      {
        "name": "service",
        "port": 50052,
        "targetPort": 50052
      },
      {
        "name": "metrics",
        "port": 9101,
        "targetPort": 9101
      }
    ]
  }
}
