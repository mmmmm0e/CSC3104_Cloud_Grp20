services:
  gate:
    build:
      context: ..
    image: cranelock-gate:0.1.0
    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:9090:9090"
    volumes:
      - gate-data:/data
      - ../demo-data/config.json:/config/config.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "cranelock_gate.healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
volumes:
  gate-data:
